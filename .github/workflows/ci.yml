name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript server and client tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.x
          check-latest: true

      - name: Install package dependencies
        shell: bash
        run: |
          set -euo pipefail
          for directory in server client; do
            test -f "${directory}/package.json"
            test -f "${directory}/package-lock.json"
            npm ci --prefix "${directory}" --ignore-scripts
          done

      - name: Run server checks
        shell: bash
        run: |
          set -euo pipefail
          npm run lint --prefix server
          npm run typecheck --prefix server
          npm run build --prefix server
          npm test --prefix server

      - name: Run client checks
        shell: bash
        run: |
          set -euo pipefail
          npm run lint --prefix client
          npm run typecheck --prefix client
          npm run build --prefix client
          npm test --prefix client

      - name: Validate static HTML entry points
        run: node .github/scripts/validate-html.mjs

      - name: Validate publishable README documents
        run: node .github/scripts/check-readmes.mjs

      - name: Validate workflow structure and release invariants
        run: node .github/scripts/check-workflows.mjs

      - name: Check repository whitespace
        run: git diff --check

  native-source:
    name: Native source sanity checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check upstream build metadata
        shell: bash
        run: |
          set -euo pipefail
          for required in COPYING COPYING.LGPL COPYING.MPL; do
            test -s "$required"
          done
          if [[ -f configure.ac ]]; then
            grep -q "BZFlag" configure.ac
          else
            echo "Native upstream build metadata is not part of this web-only checkout; skipping."
          fi
