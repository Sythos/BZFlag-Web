name: Container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: Build and scan gateway image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      IMAGE_NAME: ghcr.io/sythos/bzflag-web-server
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          check-latest: true

      - name: Check latest stable toolchain and documented pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/check-toolchain-versions.mjs --check-latest

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR on protected main pushes only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Docker build context
        run: node .github/scripts/validate-docker-context.mjs

      - name: Build gateway image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: server
          file: server/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name != 'push' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:edge
          provenance: mode=max
          sbom: true

      - name: Run real gateway health smoke on the built image
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          container_name="bzflag-web-health-${GITHUB_RUN_ID}"
          trap 'docker rm --force "$container_name" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container_name" --publish 18080:8080 "${IMAGE_NAME}:${GITHUB_SHA}"
          attempt=1
          while (( attempt <= 60 )); do
            if body="$(curl --fail --silent --show-error http://127.0.0.1:18080/healthz)" && grep -q '"status":"ok"' <<<"$body"; then
              exit 0
            fi
            sleep 1
            attempt=$((attempt + 1))
          done
          docker logs "$container_name"
          echo "Gateway container did not pass /healthz." >&2
          exit 1

      - name: Scan locally loaded image
        if: github.event_name != 'push'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
