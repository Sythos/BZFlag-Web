name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semver tag to package (for recovery only)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_BASE_BRANCH: main

jobs:
  validate-ref:
    name: Validate release tag and ancestry
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.ref.outputs.release_tag }}
      release_commit: ${{ steps.ref.outputs.release_commit }}
    steps:
      - name: Checkout requested release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate strict SemVer tag and main ancestry
        id: ref
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          BASE_BRANCH: ${{ env.RELEASE_BASE_BRANCH }}
        run: |
          set -euo pipefail
          semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$RELEASE_TAG" =~ $semver_pattern ]]; then
            echo "Release tag must be strict vMAJOR.MINOR.PATCH SemVer: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" && "$EVENT_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "The push ref does not match RELEASE_TAG." >&2
            exit 1
          fi

          tag_ref="refs/tags/$RELEASE_TAG"
          if ! git show-ref --verify --quiet "$tag_ref"; then
            echo "Release tag is not present in the checked-out repository: $RELEASE_TAG" >&2
            exit 1
          fi
          tag_object="$(git rev-parse --verify "$tag_ref")"
          if [[ "$(git cat-file -t "$tag_object")" != "tag" ]]; then
            echo "Release tags must be annotated tags: $RELEASE_TAG" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse --verify "$tag_ref^{commit}")"
          head_commit="$(git rev-parse --verify HEAD)"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "Checked-out HEAD does not match the release tag commit." >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" && "$tag_commit" != "$EVENT_SHA" ]]; then
            echo "The event SHA does not match the release tag commit." >&2
            exit 1
          fi

          git fetch --no-tags origin "+$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          base_ref="refs/remotes/origin/$BASE_BRANCH"
          if ! git show-ref --verify --quiet "$base_ref"; then
            echo "Base branch was not fetched: $BASE_BRANCH" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" "$base_ref"; then
            echo "Release tag is not an ancestor of origin/$BASE_BRANCH." >&2
            exit 1
          fi

          printf 'release_tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'release_commit=%s\n' "$tag_commit" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release gates
    needs: validate-ref
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.validate-ref.outputs.release_tag }}
      RELEASE_BASE_BRANCH: main
    steps:
      - name: Checkout validated release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-ref.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          check-latest: true

      - name: Verify runtime and locked dependency versions
        run: node .github/scripts/check-runtime-versions.mjs

      - name: Check latest stable toolchain and documented pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/check-toolchain-versions.mjs --check-latest

      - name: Fetch base branch for the ancestry gate
        run: git fetch --no-tags origin "+$RELEASE_BASE_BRANCH:refs/remotes/origin/$RELEASE_BASE_BRANCH"

      - name: Install locked TypeScript package dependencies
        shell: bash
        run: |
          set -euo pipefail
          for directory in client server; do
            test -f "$directory/package.json"
            test -f "$directory/package-lock.json"
            npm ci --prefix "$directory" --ignore-scripts
          done

      - name: Build TypeScript packages and verify compiled output
        shell: bash
        run: |
          set -euo pipefail
          npm run build --prefix client
          npm run build --prefix server
          test -d client/dist
          test -d server/dist

      - name: Validate Docker build context
        run: node .github/scripts/validate-docker-context.mjs

      - name: Verify native BZFS interoperability through the gateway
        run: node .github/scripts/verify-bzfs-interoperability.mjs

      - name: Install pinned Playwright runtime
        shell: bash
        run: |
          set -euo pipefail
          e2e_root="$RUNNER_TEMP/bzflag-web-e2e"
          mkdir -p "$e2e_root"
          npm install --prefix "$e2e_root" --no-save --no-package-lock --ignore-scripts playwright@1.62.1
          export PLAYWRIGHT_BROWSERS_PATH="$e2e_root/browsers"
          node --version
          npx --prefix "$e2e_root" playwright --version
          dry_run_status=0
          npx --prefix "$e2e_root" playwright install --dry-run --with-deps --only-shell chromium || dry_run_status=$?
          if (( dry_run_status > 1 )); then
            exit "$dry_run_status"
          fi
          timeout 12m npx --prefix "$e2e_root" playwright install --with-deps --only-shell chromium

      - name: Run real browser Connect-to-game E2E
        shell: bash
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/bzflag-web-e2e/node_modules/playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/bzflag-web-e2e/browsers
          E2E_SCREENSHOT: ${{ runner.temp }}/bzflag-web-e2e/connect-to-game.png
        run: node .github/scripts/run-browser-e2e.mjs

      - name: Run TypeScript package checks and tests
        shell: bash
        run: |
          set -euo pipefail
          for directory in client server; do
            npm run lint --prefix "$directory"
            npm run typecheck --prefix "$directory"
            npm test --prefix "$directory"
          done

      - name: Enforce protocol, world, game, renderer, PWA and gateway gates
        run: node .github/scripts/check-functional-gates.mjs

      - name: Audit release production dependencies
        shell: bash
        run: |
          set -euo pipefail
          for directory in client server; do
            npm audit --prefix "$directory" --omit=dev --audit-level=high
          done

      - name: Run compiled JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          files=(client/dist/**/*.js client/dist/**/*.mjs server/dist/**/*.js server/dist/**/*.mjs)
          if (( ${#files[@]} == 0 )); then
            echo "No compiled JavaScript files were found." >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            node --check "$file"
          done

      - name: Verify release metadata, provenance and asset closure
        run: node .github/scripts/verify-release.mjs --tag "$RELEASE_TAG" --base-ref "origin/$RELEASE_BASE_BRANCH"

      - name: Run repository compliance checks
        run: node .github/scripts/check-compliance.mjs

      - name: Validate HTML entry points
        run: node .github/scripts/validate-html.mjs

      - name: Validate publishable README documents
        run: node .github/scripts/check-readmes.mjs

      - name: Validate workflow structure and release invariants
        run: node .github/scripts/check-workflows.mjs

  security:
    name: Release security gate
    needs: validate-ref
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ needs.validate-ref.outputs.release_tag }}
    secrets: inherit

  package:
    name: Build release packages
    needs:
      - validate-ref
      - verify
      - security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.validate-ref.outputs.release_tag }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-ref.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          check-latest: true

      - name: Check latest stable toolchain and documented pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/check-toolchain-versions.mjs --check-latest

      - name: Build release directories
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          rm -rf release
          mkdir -p "release/bzflag-web-client-${version}" "release/bzflag-web-server-${version}"

          if [[ ! -d client ]]; then
            echo "client/ is required for a release." >&2
            exit 1
          fi
          if [[ ! -d server ]]; then
            echo "server/ is required for a release." >&2
            exit 1
          fi

          for directory in client server; do
            if [[ ! -f "$directory/package.json" || ! -f "$directory/package-lock.json" ]]; then
              echo "$directory requires package.json and package-lock.json for a reproducible release." >&2
              exit 1
            fi
            npm ci --prefix "$directory" --ignore-scripts
            npm run build --prefix "$directory"
            if [[ ! -d "$directory/dist" ]]; then
              echo "$directory build did not produce the required dist/ output." >&2
              exit 1
            fi
          done

          node .github/scripts/check-functional-gates.mjs

          cp -a client/. "release/bzflag-web-client-${version}/"
          cp -a server/. "release/bzflag-web-server-${version}/"
          rm -rf "release/bzflag-web-client-${version}/node_modules" "release/bzflag-web-server-${version}/node_modules"

          required_licenses=(COPYING COPYING.LGPL COPYING.MPL LICENSE-MIT NOTICE ATTRIBUTION.md AUTHORS)
          for license_file in "${required_licenses[@]}"; do
            if [[ ! -s "$license_file" ]]; then
              echo "Required license/provenance file is missing or empty: $license_file" >&2
              exit 1
            fi
          done
          for directory in "release/bzflag-web-client-${version}" "release/bzflag-web-server-${version}"; do
            cp "${required_licenses[@]}" "$directory/"
          done

          source_date_epoch="$(git show -s --format=%ct "${RELEASE_TAG}^{commit}")"
          export SOURCE_DATE_EPOCH="$source_date_epoch"
          find "release/bzflag-web-client-${version}" "release/bzflag-web-server-${version}" -exec touch -h -d "@${SOURCE_DATE_EPOCH}" {} +
          (cd release && zip -X -q -r "bzflag-web-client-${version}.zip" "bzflag-web-client-${version}")
          (cd release && tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner -czf "bzflag-web-server-${version}.tar.gz" "bzflag-web-server-${version}")
          (cd release && zip -X -q -r "bzflag-web-server-${version}.zip" "bzflag-web-server-${version}")

      - name: Build Docker package
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p release/docker
          if [[ ! -f server/Dockerfile ]]; then
            echo "server/Dockerfile is required for a release." >&2
            exit 1
          fi
          docker build --pull --tag "bzflag-web-server:${version}" --file server/Dockerfile server
          docker save "bzflag-web-server:${version}" > "release/bzflag-web-server-docker-${version}.tar"
          gzip -9 -c "release/bzflag-web-server-docker-${version}.tar" > "release/bzflag-web-server-docker-${version}.tar.gz"
          docker image inspect "bzflag-web-server:${version}" > "release/docker/image-inspect.json"
          cp server/Dockerfile release/docker/

      - name: Generate checksums, SBOM and provenance manifest
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/release-metadata.mjs --release-tag "$RELEASE_TAG" --release-dir release
          find release -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS.txt
          node .github/scripts/verify-release-artifacts.mjs --release-tag "$RELEASE_TAG" --release-dir release

      - name: Upload release bundle for publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release and GHCR image
    needs:
      - validate-ref
      - package
      - image
      - security
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release source for verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-ref.outputs.release_tag }}
          persist-credentials: false

      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: release

      - name: Verify release bundle closure, SBOM and provenance
        run: node .github/scripts/verify-release-artifacts.mjs --release-tag "$RELEASE_TAG" --release-dir release

      - name: Attest client package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/bzflag-web-client-*.zip

      - name: Attest server package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/bzflag-web-server-[0-9]*.zip
            release/bzflag-web-server-[0-9]*.tar.gz
            release/bzflag-web-server-docker-*.tar
            release/bzflag-web-server-docker-*.tar.gz

      - name: Publish GitHub release after package attestations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.validate-ref.outputs.release_commit }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            release/bzflag-web-client-*.zip
            release/bzflag-web-server-[0-9]*.zip
            release/bzflag-web-server-[0-9]*.tar.gz
            release/bzflag-web-server-docker-*.tar
            release/bzflag-web-server-docker-*.tar.gz
            release/RELEASE-MANIFEST.txt
            release/SHA256SUMS.txt
            release/sbom.spdx.json
            release/build-provenance.json
          )
          for asset in "${assets[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "Release asset is missing or empty: $asset" >&2
              exit 1
            fi
          done
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
            tag_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.type')"
            if [[ "$tag_type" == "tag" ]]; then
              tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.object.sha')"
            fi
            if [[ "$tag_object" != "$RELEASE_COMMIT" ]]; then
              echo "Existing GitHub release tag does not point to the validated commit." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "BZFlag Web Client $RELEASE_TAG" \
              --generate-notes
          fi

  image:
    name: Publish gateway image to GHCR
    needs: package
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE_NAME: ghcr.io/sythos/bzflag-web-server
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest

      - name: Build and smoke single-architecture gateway image
        shell: bash
        run: |
          set -euo pipefail
          smoke_tag="${IMAGE_NAME}:release-smoke-${GITHUB_RUN_ID}"
          docker build --pull --tag "$smoke_tag" --file server/Dockerfile server
          container_id="$(docker run --detach --publish 18080:8080 "$smoke_tag")"
          cleanup() {
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id" >&2 || true
          echo "Gateway container health check did not become ready." >&2
          exit 1

      - name: Build and publish gateway image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: server
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Attest gateway image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
