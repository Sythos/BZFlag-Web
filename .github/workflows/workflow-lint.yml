name: Workflow lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: actionlint and zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: actionlint -color

      - name: Validate workflow structure and release invariants
        run: node .github/scripts/check-workflows.mjs

      - name: Install zizmor
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zizmor-venv"
          "$RUNNER_TEMP/zizmor-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir "zizmor==1.11.0"

      - name: Run zizmor audit
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/zizmor-venv/bin/zizmor" .github/workflows
