name: Network compatibility

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipv4-ipv6:
    name: IPv4 and IPv6 gateway interoperability
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          check-latest: true

      - name: Verify runtime and install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/check-runtime-versions.mjs
          npm ci --prefix server --ignore-scripts
          npm ci --prefix client --ignore-scripts

      - name: Run mandatory IPv4 and IPv6 gateway tests
        env:
          BZFLAG_REQUIRE_IPV6: "true"
        run: npm test --prefix server

      - name: Run browser IPv4 and IPv6 endpoint checks
        run: npm test --prefix client
