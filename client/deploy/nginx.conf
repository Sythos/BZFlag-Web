# Include the locations below in an HTTPS server block whose root is client/.
location ~* \.(?:js|css|wasm|png|jpe?g|ico|wav|fmt)$ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ~* \.(?:html|webmanifest)$ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;
}

location = /service-worker.js {
    add_header Service-Worker-Allowed "/" always;
    add_header Cache-Control "no-cache" always;
}

# Keep the standard MIME table inherited from the parent http/server context.
# A partial `types` block here would replace that table and make HTML, JavaScript,
# CSS, images and localisation catalogues return the wrong content type.
# Ensure the host's standard `mime.types` include is enabled; modern Nginx
# already maps webmanifest, wasm and wav correctly.
